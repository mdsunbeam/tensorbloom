[package]
name = "tensorbloom"
version = "0.1.0"
description = "Graphical editor for training neural networks"
authors = ["MD Sunbeam"]
license = "MIT"
repository = "https://github.com/mdsunbeam/tensorbloom"
edition = "2021"

[lib]
name = "tensorbloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
